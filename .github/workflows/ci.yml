name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly — catches provider/API drift

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- The gate: unit + e2e with the rule-based provider, no secrets --------
  gate:
    name: Tests (${{ matrix.os }} py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - uses: browser-actions/setup-firefox@v1
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-selenium
      - name: Unit tests
        run: pytest tests/unit -q
      - name: E2E + integration (rule-based provider, chrome + firefox)
        run: pytest tests/e2e tests/integrations -q -rs
        env:
          HEADLESS: "true"

  # ---- AI providers (HTTP + SDK): informational (continue-on-error) --------
  ai-providers:
    name: Heal E2E (${{ matrix.provider }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        provider: [openai, anthropic, gemini, ollama, claude-subscription]
    steps:
      - uses: actions/checkout@v4
      - name: Gate on secret
        id: gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          case "${{ matrix.provider }}" in
            openai)              k="$OPENAI_API_KEY" ;;
            anthropic)           k="$ANTHROPIC_API_KEY" ;;
            gemini)              k="$GEMINI_API_KEY" ;;
            ollama)              k="$OLLAMA_API_KEY" ;;
            claude-subscription) k="$CLAUDE_CODE_OAUTH_TOKEN" ;;
          esac
          [ -n "$k" ] && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
      - uses: browser-actions/setup-chrome@v1
        if: steps.gate.outputs.run == 'true'
        with:
          chrome-version: stable
      - if: steps.gate.outputs.run == 'true'
        run: |
          pip install --upgrade pip
          if [ "${{ matrix.provider }}" = "anthropic" ] || [ "${{ matrix.provider }}" = "claude-subscription" ]; then
            pip install -e ".[dev,anthropic]"
          else
            pip install -e ".[dev]"
          fi
      - name: Heal a broken locator via ${{ matrix.provider }}
        if: steps.gate.outputs.run == 'true'
        env:
          HEADLESS: "true"
          HEALER_PROVIDER: ${{ matrix.provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gpt-oss:120b' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: pytest tests/e2e/test_ai_providers.py -q --provider-live

  # ---- ollama-local: a real self-hosted ollama server + a small model ------
  ollama-local:
    name: Heal E2E (ollama-local)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Start ollama + pull a small model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags && break; sleep 1; done
          ollama pull qwen2.5:3b
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - name: Heal a broken locator via ollama-local
        env:
          HEADLESS: "true"
          HEALER_PROVIDER: ollama-local
          OLLAMA_LOCAL_MODEL: qwen2.5:3b
          OLLAMA_LOCAL_BASE_URL: http://localhost:11434
        run: pytest tests/e2e/test_ai_providers.py::test_provider_heals_broken_id -q --provider-live

  # ---- copilot-subscription: the copilot CLI + github-copilot-sdk ----------
  # Gated on a COPILOT_GITHUB_TOKEN secret (a PAT with Copilot access) — add it to run this job.
  copilot-subscription:
    name: Heal E2E (copilot-subscription)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Gate on secret
        id: gate
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: '[ -n "$COPILOT_GITHUB_TOKEN" ] && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"
      - uses: browser-actions/setup-chrome@v1
        if: steps.gate.outputs.run == 'true'
        with:
          chrome-version: stable
      - if: steps.gate.outputs.run == 'true'
        run: |
          npm install -g @github/copilot
          pip install --upgrade pip && pip install -e ".[dev,copilot-subscription]"
      - name: Heal a broken locator via copilot-subscription
        if: steps.gate.outputs.run == 'true'
        env:
          HEADLESS: "true"
          HEALER_PROVIDER: copilot-subscription
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: pytest tests/e2e/test_ai_providers.py::test_provider_heals_broken_id -q --provider-live

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
